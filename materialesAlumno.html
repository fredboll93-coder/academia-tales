<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Materiales de Estudio - Academia Tales</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, rgba(2, 6, 23, 0.7) 0%, rgba(10, 15, 30, 0.9) 100%), 
                  url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2560&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .main-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-bar {
      background: rgba(11, 18, 32, 0.85);
      border: 3px solid rgba(148, 163, 184, 0.15);
      border-top: 3px solid rgba(148, 163, 184, 0.4);
      border-radius: 24px;
      padding: 12px 35px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .top-bar-marca {
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 0;
    }

    .top-bar-logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-top: -6px;
      flex-shrink: 0;
    }

    .top-bar-acciones {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .top-bar-sesion {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-left: 5px;
    }

    .main-card {
      background: rgba(11, 18, 32, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-top: 2px solid rgba(148, 163, 184, 0.4);
      border-radius: 24px;
      padding: 35px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .header-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .btn-secondary {
      background: rgba(148, 163, 184, 0.1);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-secondary:hover {
      background: rgba(148, 163, 184, 0.2);
    }

    .btn-nav-top {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-nav-top:hover {
      background: rgba(16, 185, 129, 0.3);
      color: #fff;
    }

    /* Tarjetas de Carpetas */
    .folder-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .folder-item {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .folder-item:hover {
      transform: translateY(-2px);
      border-color: rgba(52, 211, 153, 0.45);
      background: rgba(30, 41, 59, 0.75);
    }

    .folder-info {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .folder-icon {
      font-size: 22px;
      flex-shrink: 0;
    }

    .folder-name {
      font-size: 15px;
      font-weight: 600;
      color: #f8fafc;
      word-break: break-word;
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
        background-attachment: scroll;
      }

      .main-container {
        gap: 14px;
      }

      .top-bar {
        flex-direction: column;
        align-items: stretch;
        padding: 14px 16px;
        border-radius: 18px;
        gap: 12px;
      }

      .top-bar-marca {
        gap: 12px;
      }

      .top-bar-logo {
        width: 58px;
        height: 58px;
        margin-top: 0;
      }

      .top-bar-titulo {
        margin-top: 0 !important;
        min-width: 0;
      }

      .top-bar-titulo h2 {
        font-size: 17px !important;
        line-height: 1.25;
      }

      .top-bar-acciones {
        width: 100%;
        justify-content: space-between;
        gap: 8px;
      }

      .top-bar-acciones > .btn-nav-top {
        flex: 1 1 0;
        padding: 8px 10px;
      }

      .top-bar-sesion {
        flex-direction: row;
        width: 100%;
        margin-left: 0;
        gap: 8px;
      }

      .top-bar-sesion > button {
        flex: 1 1 0;
        padding: 7px 10px !important;
      }

      .main-card {
        padding: 20px 16px;
        border-radius: 18px;
      }

      .header-section {
        margin-bottom: 18px;
      }

      .header-section h1 {
        font-size: 19px !important;
      }

      .folder-item {
        padding: 14px 16px;
        gap: 10px;
      }

      .folder-name {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">

    <!-- Barra Superior -->
    <div class="top-bar">
      <div class="top-bar-marca">
        <img src="logo.png" alt="Logo" class="top-bar-logo">
        <div class="top-bar-titulo" style="margin-top: 5px;">
          <h2 style="margin: 0 0 4px 0; font-size: 20px; font-weight: 700; color: #f8fafc;">Materiales – <span id="uni-siglas-header"></span></h2>
          <p style="margin: 0; font-size: 13px; color: #94a3b8;">Academia Tales • Panel del Alumno</p>
        </div>
      </div>

      <!-- Botones de navegación rápida, cerrar sesión y volver -->
      <div class="top-bar-acciones">
        <a href="#" id="linkSimulacros" class="btn-nav-top"><i class="fa-solid fa-file-signature"></i> Simulacros</a>
        <a href="#" id="linkClases" class="btn-nav-top"><i class="fa-solid fa-circle-play"></i> Clases</a>
        
        <div class="top-bar-sesion">
          <button id="btn-cerrar-sesion" class="btn-secondary" style="background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3); padding: 5px 12px; font-size: 12px;">
            <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
          </button>
          <button id="btn-volver" class="btn-secondary" style="padding: 5px 12px; font-size: 12px;">
            <i class="fa-solid fa-arrow-left"></i> Volver
          </button>
        </div>
      </div>
    </div>

    <!-- Panel Principal -->
    <div class="main-card">
      <div class="header-section">
        <div>
          <h1 style="font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px;">Materiales de Estudio Disponibles</h1>
          <p style="font-size: 13px; color: #94a3b8;">Selecciona una carpeta para visualizar las separatas y documentos PDF.</p>
        </div>
      </div>

      <!-- Lista de Carpetas -->
      <div id="folder-container" class="folder-list">
        <!-- Se llena dinámicamente -->
      </div>
    </div>

  </div>

  <script type="module">
    import { supabase } from './supabaseClient.js';

    const urlParams = new URLSearchParams(window.location.search);
    const siglas = urlParams.get('siglas') || urlParams.get('uni') || localStorage.getItem('universidadSeleccionada') || sessionStorage.getItem('uniActual') || 'UNAP';
    const siglaLim = String(siglas).trim().toLowerCase();
    const cacheKey = `tales_carpetas_materiales_${siglaLim}`;

    document.getElementById('uni-siglas-header').textContent = siglas;
    
    document.getElementById('linkSimulacros').href = `simulacrosAlumno.html?siglas=${encodeURIComponent(siglas)}`;
    document.getElementById('linkClases').href = `clasesGrabadasAlumno.html?siglas=${encodeURIComponent(siglas)}`;

    document.getElementById('btn-volver').onclick = () => {
      window.location.href = `detalleUniversidad.html?uni=${encodeURIComponent(siglas)}`;
    };

    document.getElementById('btn-cerrar-sesion').onclick = () => {
      sessionStorage.clear();
      localStorage.removeItem("usuarioLogueado");
      window.location.href = "index.html";
    };

    let carpetasMateriales = [];

    function leerCacheMateriales() {
      try {
        const raw = sessionStorage.getItem(cacheKey) || localStorage.getItem(cacheKey);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : null;
      } catch (e) {
        return null;
      }
    }

    function guardarCacheMateriales(lista) {
      try {
        const serialized = JSON.stringify(lista);
        sessionStorage.setItem(cacheKey, serialized);
        localStorage.setItem(cacheKey, serialized);
      } catch (e) {}
    }

    async function cargarCarpetas() {
      const container = document.getElementById('folder-container');
      const cacheInicial = leerCacheMateriales();

      if (cacheInicial && cacheInicial.length > 0) {
        carpetasMateriales = cacheInicial;
        renderizarCarpetas();
      } else {
        container.innerHTML = `<p style="font-size: 13px; color: #94a3b8; text-align: center; padding: 20px;">Cargando carpetas de materiales...</p>`;
      }

      try {
        let encontradas = [];

        const { data: uniMatch, error: errUni } = await supabase
          .from('universidades')
          .select('*')
          .ilike('siglas', siglaLim)
          .limit(1);

        let uniData = (!errUni && Array.isArray(uniMatch) && uniMatch.length > 0) ? uniMatch[0] : null;

        if (!uniData) {
          const { data: unis, error } = await supabase.from('universidades').select('*');
          if (!error && Array.isArray(unis)) {
            uniData = unis.find(u => String(u.siglas || u.nombre || "").trim().toLowerCase() === siglaLim) || null;
          }
        }

        if (uniData) {
          const rawMats = uniData.materiales;
          if (Array.isArray(rawMats)) {
            encontradas = rawMats.filter(c => c && c.oculto !== true && c.habilitado !== false && c.activo !== false);
          } else if (rawMats && typeof rawMats === 'object' && Array.isArray(rawMats.carpetas)) {
            encontradas = rawMats.carpetas.filter(c => c && c.oculto !== true && c.habilitado !== false && c.activo !== false);
          }
        }

        if (encontradas.length === 0) {
          const { data: tablaMats, error: errMats } = await supabase.from('materiales').select('*');
          if (!errMats && Array.isArray(tablaMats)) {
            encontradas = tablaMats.filter(c => {
              const sUni = String(c.universidad_siglas || c.universidad || c.siglas || "").trim().toLowerCase();
              return (!sUni || sUni === siglaLim) && c.oculto !== true && c.habilitado !== false && c.activo !== false;
            });
          }
        }

        carpetasMateriales = encontradas;
        guardarCacheMateriales(carpetasMateriales);
      } catch (e) {
        console.error("Error al cargar materiales desde Supabase:", e);
        if (!cacheInicial || cacheInicial.length === 0) {
          carpetasMateriales = [];
        }
      }

      renderizarCarpetas();
    }

    function renderizarCarpetas() {
      const container = document.getElementById('folder-container');
      container.innerHTML = '';

      if (carpetasMateriales.length === 0) {
        container.innerHTML = `<p style="font-size: 13px; color: #94a3b8; font-style: italic; text-align: center; padding: 20px;">Aún no hay materiales o PDF subidos por la administración.</p>`;
        return;
      }

      carpetasMateriales.forEach((carpeta, idx) => {
        const folderId = carpeta.id ?? idx;
        const nombreCarpeta = carpeta.nombre || carpeta.titulo || `Carpeta ${idx + 1}`;
        container.innerHTML += `
          <div class="folder-item" onclick="abrirContenidoCarpeta('${encodeURIComponent(folderId)}')">
            <div class="folder-info">
              <span class="folder-icon">📁</span>
              <span class="folder-name">${nombreCarpeta}</span>
            </div>
            <span style="font-size: 13px; color: #34d399; font-weight: 600; flex-shrink: 0;">Ver materiales →</span>
          </div>
        `;
      });
    }

    window.abrirContenidoCarpeta = function(folderId) {
      window.location.href = `contenido-carpeta.html?siglas=${encodeURIComponent(siglas)}&folderId=${folderId}&modo=alumno`;
    };

    cargarCarpetas();
  </script>
</body>
</html>
